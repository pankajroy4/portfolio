services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      POSTGRES_USER: pankajroy
      POSTGRES_PASSWORD: Pankajroy@01
      POSTGRES_DB: portfolio_development
      POSTGRES_TEST_DB: portfolio_test
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    tty: true
    stdin_open: true
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: pankajroy
      DATABASE_PASSWORD: Pankajroy@01
      POSTGRES_DB: portfolio_development
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: ./bin/dev

volumes:
  pgdata:
  bundle:
  node_modules:
